name: Python CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pytest
    - name: Run verification test
      run: |
        python -c "from src.early_warning import PeatlandFireRiskClassifier; res = PeatlandFireRiskClassifier.classify_risk(0.05, 16, 100, 36.5); assert res['alert_level'] == 'EXTREME'; print('Verification test passed!')"
